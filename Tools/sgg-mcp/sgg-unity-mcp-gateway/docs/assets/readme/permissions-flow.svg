<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Feature flags, policy, and approval flow">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="219" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="440" y="31" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Visibility is not permission. Permission is not approval.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="35" y="65" width="210" height="100" rx="13" fill="#161b22" stroke="#58a6ff"/>
    <text x="140" y="92" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">1. Feature flags</text>
    <text x="140" y="118" text-anchor="middle" fill="#c9d1d9" font-size="12">make command families</text>
    <text x="140" y="136" text-anchor="middle" fill="#c9d1d9" font-size="12">discoverable</text>
    <text x="140" y="154" text-anchor="middle" fill="#8b949e" font-size="11">restart after config change</text>

    <rect x="335" y="65" width="210" height="100" rx="13" fill="#161b22" stroke="#a371f7"/>
    <text x="440" y="92" text-anchor="middle" fill="#a371f7" font-size="16" font-weight="700">2. Policy</text>
    <text x="440" y="118" text-anchor="middle" fill="#c9d1d9" font-size="12">allow · ask · deny</text>
    <text x="440" y="136" text-anchor="middle" fill="#c9d1d9" font-size="12">per project and package trust</text>
    <text x="440" y="154" text-anchor="middle" fill="#8b949e" font-size="11">valid replacement reloads live</text>

    <rect x="635" y="65" width="210" height="100" rx="13" fill="#161b22" stroke="#d29922"/>
    <text x="740" y="92" text-anchor="middle" fill="#d29922" font-size="16" font-weight="700">3. Approval</text>
    <text x="740" y="118" text-anchor="middle" fill="#c9d1d9" font-size="12">one exact ask-gated request</text>
    <text x="740" y="136" text-anchor="middle" fill="#c9d1d9" font-size="12">native elicitation or fallback</text>
    <text x="740" y="154" text-anchor="middle" fill="#8b949e" font-size="11">agent cannot self-approve</text>
  </g>
  <line x1="245" y1="115" x2="326" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="545" y1="115" x2="626" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="197" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="12">Every accepted request is revalidated before execution; context drift invalidates old approval.</text>
</svg>